name: Sync Repository Labels

on:
  push:
    branches:
      - main
    paths:
      - '.github/settings.yml'
      - '.github/workflows/sync-labels.yml'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync-labels:
    name: Sync Labels from .github/settings.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Labels from .github/settings.yml
        id: extract
        run: |
          python3 - << 'EOF'
          import yaml, json

          with open(".github/settings.yml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          labels = []
          for item in data.get("labels", []):
              labels.append({
                  "name": item["name"],
                  "color": str(item["color"]).lstrip("#"),
                  "description": item.get("description", "")
              })

          with open(".github/labels.generated.json", "w", encoding="utf-8") as out:
              json.dump(labels, out, indent=2)

          print(f"Extracted {len(labels)} labels from .github/settings.yml")
          EOF

      - name: Apply Labels to GitHub Repository
        uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.generated.json
          delete-other-labels: true
          token: ${{ secrets.GITHUB_TOKEN }}