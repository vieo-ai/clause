name: Synchronize Repository Labels

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/settings.yml'

jobs:
  label-sync:
    name: Sync Labels from settings.yml
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Labels Array from settings.yml
        run: |
          yq '.labels' .github/settings.yml > /tmp/labels.yml

      - name: Run EndBug Label Sync
        uses: EndBug/label-sync@v2
        with:
          config-file: /tmp/labels.yml
          delete-other-labels: false