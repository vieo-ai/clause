repository:
    # See https://developer.github.com/v3/repos/#edit for all available settings.

    # The name of the repository. Changing this will rename the repository
    #name: repo-name

    # A short description of the repository that will show up on GitHub
    #description: description of repo

    # A URL with more information about the repository
    #homepage: https://example.github.io/

    # A comma-separated list of topics to set on the repository
    #topics: project, template, project-template

    # Either `true` to make the repository private, or `false` to make it public.
    #private: false

    # Either `true` to enable issues for this repository, `false` to disable them.
    #has_issues: true

    # Either `true` to enable the wiki for this repository, `false` to disable it.
    #has_wiki: true

    # Either `true` to enable downloads for this repository, `false` to disable them.
    #has_downloads: true

    # Updates the default branch for this repository.
    #default_branch: master

    # Either `true` to allow squash-merging pull requests, or `false` to prevent
    # squash-merging.
    #allow_squash_merge: true

    # Either `true` to allow merging pull requests with a merge commit, or `false`
    # to prevent merging pull requests with merge commits.
    #allow_merge_commit: true

    # Either `true` to allow rebase-merging pull requests, or `false` to prevent
    # rebase-merging.
    #allow_rebase_merge: true

# Labels: define labels for Issues and Pull Requests
labels:
    - name: 'Status: Backlog'
      color: d4c5f9
      description: Items that are defined and prioritized but not yet started.

    - name: 'Status: Ready'
      color: 0e8a16
      description: Items that are fully defined, estimated, and ready to be picked up in a sprint.

    - name: 'Status: In Progress'
      color: 006b75
      description: Items actively being worked on.

    - name: 'Status: In Review'
      color: cfd3d7
      description: Items completed by a developer and awaiting review (code review, QA, etc.).

    - name: 'Status: Done'
      color: 84b6eb
      description: Items that are fully completed, tested, and potentially deployed.

    - name: 'Status: Blocked'
      color: cc317c
      description: Items that cannot proceed due to external dependencies or issues.

    - name: 'Status: Duplicate'
      color: EB862D
      description: Duplicate of another issue.

    - name: 'Status: Invalid'
      color: faef50
      description: This issue doesn't seem right.

    - name: "Status: Won't fix"
      color: C8D9E6
      description: Reported issue is working as intended.

    - name: 'Priority: Critical'
      color: b60205
      description: Task is considered critical-priority.

    - name: 'Priority: High +'
      color: d93f0b
      description: Task is considered high-priority.

    - name: 'Priority: Medium'
      color: fbca04
      description: Task is considered medium-priority.

    - name: 'Priority: Low -'
      color: 0e8a16
      description: Task is considered low-priority.

    - name: 'Severity: Blocker'
      color: 660000
      description: Severity is considered blocking.

    - name: 'Severity: Major'
      color: FF0000
      description: Severity is considered major.

    - name: 'Severity: Minor'
      color: ff9900
      description: Severity is considered minor.

    - name: 'Severity: Trivial'
      color: 336600
      description: Severity is considered trivial.

    - name: 'Area: Core'
      color: 6600ff
      description: For work related to foundational components like Nomad, Consul, Vault, or Pulumi.

    - name: 'Area: Infra'
      color: 0052cc
      description: For infrastructure provisioning and management (e.g., Terraform, Packer, MAAS)

    - name: 'Area: Security'
      color: b58e00
      description: For issues related to Vault, Boundary, security hardening, or compliance

    - name: 'Area: AI-MLOps'
      color: cfd3d7
      description: For MLflow, BeeAI, LiteLLM, or other AI/ML lifecycle components

    - name: 'Area: UI-UX'
      color: c5def5
      description: For user interface or user experience related tasks, including Directus UI

    - name: 'Area: Dev-Experience'
      color: f5d0a9
      description: For work on VSCodium, Roocode, CLI, or local development setup

    - name: 'Area: Specialized-Engines'
      color: 884488
      description: For components like Pro-Media Engine (JUCE/Tracktion), AudioGridder, Kazoo, OBS, TVHeadend

    - name: 'Area: Docs'
      color: d876e3
      description: For documentation efforts (e.g., quickstarts, whitepapers)

    - name: 'Area: CI-CD'
      color: f9d0c4
      description: For Continuous Integration/Deployment pipeline work (e.g., GitHub Actions)

    - name: 'Area: Research'
      color: 669966
      description: For exploratory or investigation tasks.
    
    - name: 'Area: Integration'
      color: 669966
      description: For exploratory or investigation tasks.

    - name: 'Size: XL'
      color: 006600
      description: Xtra Large sprint planning and capacity estimation.

    - name: 'Size: L'
      color: 339933
      description: Large sprint planning and capacity estimation.

    - name: 'Size: M'
      color: 66cc66
      description: Medium sprint planning and capacity estimation.

    - name: 'Size: S'
      color: 99ff99
      description: Small sprint planning and capacity estimation.

    - name: 'Size: XS'
      color: ccffcc
      description: Extra Small sprint planning and capacity estimation.

    - name: '3rd party issue'
      color: e88707
      description: This issue might be caused by a 3rd party script/package/other reasons

    - name: 'Os: Windows'
      color: AEB1C2
      description: Is Windows-specific

    - name: 'Os: Mac'
      color: AEB1C2
      description: Is Mac-specific

    - name: 'Os: Linux'
      color: AEB1C2
      description: Is Linux-specific

    - name: 'Os: iOS'
      color: AEB1C2
      description: Is iOS-specific

    - name: 'Os: Android'
      color: AEB1C2
      description: Is Android-specific
