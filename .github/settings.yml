# GitHub Repository Settings (probot/settings / safe-settings format)
# Repository: vieo-ai/clause

repository:
  # See https://developer.github.com/v3/repos/#edit for all available settings.
  name: clause
  description: "🐾 ClauseOS (cx): Bare-metal hermetic operating substrate, Clause (.cx) carrier language, and 🐯 TIGAH autonomous AI & transmedia orchestration platform."
  homepage: https://vieo.ai
  topics: clauseos, clause, hermetic-os, beam, rust, nushell, mise, nomad, consul, vault, tigah, transmedia, ai-agents, vieo
  private: false
  has_issues: true
  has_wiki: false
  has_downloads: true
  default_branch: main

  # Enforce linear squash-merge history for deterministic Conventional Commits & SemVer changelog generation
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false

# Labels: define labels for Issues, Pull Requests, and Virtual Enterprise (.enterprise/) routing
labels:
 # --- Workflow & Triage Status ---
- name: 'Status: Backlog'
  color: 'd4c5f9'
  description: "Defined and prioritized in roadmap or CCEFS curriculum, not yet started."

- name: 'Status: Ready'
  color: '0e8a16'
  description: "Fully specified with clear verification gate criteria and ready for work."

- name: 'Status: In Progress'
  color: '006b75'
  description: "Actively being implemented by a maintainer or Virtual Enterprise agent."

- name: 'Status: In Review'
  color: 'cfd3d7'
  description: "PR open and awaiting maintainer review and offline cx test verification."

- name: 'Status: Done'
  color: '84b6eb'
  description: "Verified against all deterministic gates and merged into main."

- name: 'Status: Blocked'
  color: 'cc317c'
  description: "Blocked by upstream toolchain release, hardware target, or dependency."

- name: 'Status: Duplicate'
  color: 'EB862D'
  description: "Duplicate of an existing issue or defect ledger entry."

- name: 'Status: Invalid'
  color: 'faef50'
  description: "Out of scope or invalid report."

- name: "Status: Won't fix"
  color: 'C8D9E6'
  description: "Working as intended per ClauseOS hermeticity or architectural invariants."

# --- Priority ---
- name: 'Priority: Critical'
  color: 'b60205'
  description: "Blocks Stage 0/1 boot, breaks .home/ confinement, or halts release gate."

- name: 'Priority: High'
  color: 'd93f0b'
  description: "High-impact defect or milestone deliverable for active v0.9.0-dev runway."

- name: 'Priority: Medium'
  color: 'fbca04'
  description: "Standard priority enhancement or non-blocking defect."

- name: 'Priority: Low'
  color: '0e8a16'
  description: "Nice-to-have polish, cleanup, or deferred optimization."

# --- Severity ---
- name: 'Severity: Blocker'
  color: '660000'
  description: "Completely prevents bootstrapping, compilation, or test gate execution."

- name: 'Severity: Major'
  color: 'FF0000'
  description: "Core subsystem regression or host-OS environment leak."

- name: 'Severity: Minor'
  color: 'ff9900'
  description: "Partial degradation with a deterministic workaround."

- name: 'Severity: Trivial'
  color: '336600'
  description: "Cosmetic, typo, or minor DX friction."

# --- ClauseOS Architectural Areas (Character Limits Verified: <100 chars) ---
- name: 'Area: Substrate & Boot'
  color: '6600ff'
  description: "Stage 0 trampolines (cx.*), .home/ jail, and config/env/*.toml SSOT engine."

- name: 'Area: Compiler (cxc)'
  color: '5319e7'
  description: "Clause (.cx) frontend, AST/macros, and multi-target emitters in packages/clause/."

- name: 'Area: BEAM & Orchestrator'
  color: '7057ff'
  description: "OTP 29 backplane, packages/clause_jet/, RinG FFI, and HashiStack (Nomad/Vault)."

- name: 'Area: Infra & MaaS'
  color: '0052cc'
  description: "Native Rust Pulumi IaC, Pixiecore + Packer iPXE MaaS, and cx vm micro-VMs."

- name: 'Area: TIGAH & AI'
  color: '1d76db'
  description: "Local neural coprocessors (Lemonade, FastFlowLM, InferSSD), $HF_HOME, 1B-7B SLMs."

- name: 'Area: Virtual Enterprise'
  color: '0e8a16'
  description: "Root apm.yml, .apm/ packages, MCP/A2A protocols, and harness projection."

- name: 'Area: Transmedia & Telecom'
  color: '884488'
  description: "Zero-alloc audio/video DSP (oximedia, nih-plug), Kazoo switching, and Membrane."

- name: 'Area: Plugins & Toolchains'
  color: '006b75'
  description: "Lua Mise adapters (plugins/cx-*), sterilized Scoop, and confined Homebrew."

- name: 'Area: CLI & DX'
  color: 'f5d0a9'
  description: "Nushell command router (scripts/cli/nu/) and Flight Deck UIs (Lustre/Shore/O2K)."

- name: 'Area: Security'
  color: 'b58e00'
  description: "Zero-leak sandbox hardening, Vault leases, OS sandboxes (Landlock/Seatbelt)."

- name: 'Area: CI-CD & Tests'
  color: 'f9d0c4'
  description: "Offline verification gates (cx test, run_all.nu, run_tests.ps1) and CI workflows."

- name: 'Area: Docs & Curriculum'
  color: 'd876e3'
  description: "ADRs (docs/adr/), Track 1 CCEFS modules (docs/ccefs/), and vieo.ai portal."

# --- Effort / Sizing ---
- name: 'Size: XL'
  color: '006600'
  description: "Multi-module architectural milestone or full subsystem vertical slice."

- name: 'Size: L'
  color: '339933'
  description: "Significant feature or cross-platform substrate implementation."

- name: 'Size: M'
  color: '66cc66'
  description: "Self-contained module, CLI command, or cx-* plugin update."

- name: 'Size: S'
  color: '99ff99'
  description: "Focused bug fix, test assertion, or config overlay update."

- name: 'Size: XS'
  color: 'ccffcc'
  description: "Trivial patch, version pin bump, or documentation fix."

# --- Targets & External ---
- name: 'Upstream / 3rd Party'
  color: 'e88707'
  description: "Issue originates in upstream toolchain (Mise, Nushell, Gleam, OTP, Scoop)."

- name: 'Target: Windows'
  color: 'AEB1C2'
  description: "Specific to Windows 10/11 (x64), PowerShell 7, Patched Scoop, or WSL2."

- name: 'Target: Linux'
  color: 'AEB1C2'
  description: "Specific to Linux (x64/arm64), POSIX Stage 0, Landlock/Bubblewrap, or MaaS."

- name: 'Target: macOS'
  color: 'AEB1C2'
  description: "Specific to macOS (Apple Silicon/Intel), confined Homebrew, or Seatbelt."

- name: 'Target: Hardware'
  color: 'AEB1C2'
  description: "Hardware backends (AMD Strix Halo / ROCm, XDNA2 NPU, NVIDIA CUDA, Metal)."
