# Probot Automation Configuration (.github/config.yml)
# Repository: vieo-ai/clause.os

# ------------------------------------------------------------------------------
# 1. First-Time Contributor Onboarding (behaviorbot/new-issue-welcome)
# ------------------------------------------------------------------------------
newIssueWelcomeComment: >
  Welcome to **Vieo / ClauseOS** (`vieo-ai/clause.os`), and thank you for opening your first issue!
  To help maintainers and Virtual Enterprise agents triage and reproduce this deterministically, please ensure you have included:
  - Your target platform (`Windows`, `Linux`, or `macOS`) and hardware backend if applicable (e.g., `Strix Halo / ROCm`, `XDNA2 NPU`, `CUDA`, `Metal`)
  - Output from `clause doctor` or `clause test` (`tests/system/run_all.nu`)
  - Any relevant `config/env/*.toml` overlay or `plugins/cx-*` adapter context

  Please also review our [Contributing Guidelines](CONTRIBUTING.md) and [Code of Conduct](CODE_OF_CONDUCT.md).

# ------------------------------------------------------------------------------
# 2. First-Time PR Welcome (behaviorbot/new-pr-welcome)
# ------------------------------------------------------------------------------
newPRWelcomeComment: >
  Thank you for opening your first pull request to **ClauseOS** (`vieo-ai/clause.os`)!
  Before review, please verify that your PR meets our repository invariants:
  - **PR Title:** Uses Conventional Commits (`feat:`, `fix:`, `refactor:`, `docs:`, `test:`, `chore:`) for deterministic SemVer (`v0.9.0-dev.x`) release notes
  - **Zero-Leak Confinement:** All state, caches, and toolchains remain strictly confined inside `.home/` and resolve through `config/env/*.toml`
  - **Verification Gates:** Both `clause test` (`tests/system/run_all.nu`) and `pwsh tests/env/run_tests.ps1` pass cleanly across target platforms

  See [CONTRIBUTING.md](CONTRIBUTING.md) for full details.

# ------------------------------------------------------------------------------
# 3. First PR Merge Celebration (behaviorbot/first-pr-merge)
# ------------------------------------------------------------------------------
firstPRMergeComment: >
  Congratulations on merging your first pull request into **ClauseOS**!
  Thank you for helping build sovereign, bare-metal userland infrastructure with **Vieo**.

# ------------------------------------------------------------------------------
# 4. Automated Code Marker Tracking (jasonetco/todo)
# ------------------------------------------------------------------------------
todo:
  keyword:
    - '@todo'
    - 'TODO(clause)'
    - 'FIXME(clause)'
  autoAssign: false
  blobLines: 10
  caseSensitive: false
  label: 'Status: Backlog'
  reopenClosed: true

# ------------------------------------------------------------------------------
# 5. Stale Issue & PR Hygiene (probot/stale)
# ------------------------------------------------------------------------------
stale:
  daysUntilStale: 45
  daysUntilClose: 14
  exemptLabels:
    - 'Priority: Critical'
    - 'Severity: Blocker'
    - 'Status: In Progress'
    - 'Status: Blocked'
    - 'Area: Docs & Curriculum'
  staleLabel: 'Status: Backlog'
  markComment: >
    This issue or pull request has had no activity for 45 days. If it is still relevant to the active
    ClauseOS (`v0.9.0-dev.x`) runway, please comment with an update or reproduction log; otherwise it will close automatically in 14 days.
  closeComment: >
    Closing due to inactivity. Feel free to reopen or file a fresh issue with updated `clause doctor` diagnostics if this persists.