name: "💉 Failing Test / CI Gate"
description: "Report failing verification suites (clause test, run_tests.ps1), plugin tests, or CI jobs."
title: "[Test] "
labels: ["Area: CI-CD & Tests", "Status: Backlog"]

body:
  - type: markdown
    attributes:
      value: |
        # **💉 Failing Test / CI Gate**
        Use this form to report failing offline verification suites (`clause test`), cross-shell environment tests (`run_tests.ps1`), `plugins/cx-*` adapter checks, or GitHub Actions CI runners.

  - type: dropdown
    id: subsystem
    attributes:
      label: Affected Subsystem / Test Suite
      description: Select the ClauseOS subsystem, plugin, or verification suite where the test is failing.
      options:
        - "Stage 0 Bootloader & Hydration (cx.bat / cx.ps1 / cx.sh)"
        - "SSOT Environment Engine (config/env/*.toml / 8-pass expansion)"
        - "Hermeticity & Sandbox Isolation (.home/ / PATH / AppData / XDG)"
        - "Cross-Shell Environment Suite (tests/env/run_tests.ps1)"
        - "Systems Verification Suite (tests/system/run_all.nu)"
        - "Polyglot CLI & Nushell Router (scripts/cli/nu/)"
        - "Package Substrate (Sterilized Scoop / Confined Brew / Mise)"
        - "Plugin: cx-comfyui"
        - "Plugin: cx-fastflowlm"
        - "Plugin: cx-inferssd"
        - "Plugin: cx-lemonade"
        - "Plugin: cx-multipass"
        - "Plugin: cx-unsloth"
        - "Plugin: cx-vscode"
        - "Compiler & Language Core (packages/clause / cxc)"
        - "BEAM & Orchestrator (packages/clause_jet / tools/ring / HashiStack)"
        - "Infra, MaaS & Micro-VMs (crates/clause-pulumi / cx vm / Pixiecore)"
        - "TIGAH AI & Unified Model Hub ($HF_HOME / 40-ml-hub.toml)"
        - "Virtual Enterprise & Harnesses (.enterprise / .apm / MCP)"
        - "GitHub Actions Workflow (.github/workflows/)"
    validations:
      required: true

  - type: dropdown
    id: target-platform
    attributes:
      label: Target Platform & Runner Environment
      description: Select the OS or CI runner environment where the failure occurred.
      options:
        - "Windows 10/11 (x64 - PowerShell 7)"
        - "Linux (x64 / arm64 - GNU / musl)"
        - "macOS (Apple Silicon / Intel)"
        - "GitHub Actions CI (windows-latest)"
        - "GitHub Actions CI (ubuntu-latest)"
        - "GitHub Actions CI (macos-latest)"
        - "Micro-VM (WSL2 / Lima / Multipass)"
    validations:
      required: true

  - type: input
    id: failing-tests
    attributes:
      label: Failing Command, CI Job, or Assertion
      description: Specify the exact command, test file, or CI job name that failed.
      placeholder: "e.g., clause test (test_hermeticity.nu), pwsh tests/env/run_tests.ps1, or ci.yml / windows-test"
    validations:
      required: true

  - type: textarea
    id: failure-output
    attributes:
      label: Failure Log & Diagnostic Output
      description: Paste the exact assertion error, stack trace, or `clause doctor` output (formatted inside code blocks).
      placeholder: |
        ```text
        [Hermeticity Failure] PATH leak! Expected head ...
        ```
    validations:
      required: true

  - type: textarea
    id: reason-for-failure
    attributes:
      label: Root Cause Analysis / Expected Behavior
      description: Describe why the test is failing, any host-OS leakage observed, or what is needed to make it pass.
      placeholder: "Explain the expected invariant vs. actual behavior."

  - type: dropdown
    id: is-regression
    attributes:
      label: Is this a regression?
      description: Did this test or CI gate pass on an earlier commit or release tag (`v0.9.0-dev.x`)?
      options:
        - "Yes"
        - "No"
        - "Not Sure"
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add hardware accelerator details (Strix Halo/ROCm, XDNA2 NPU, CUDA, Metal), commit SHA, or screenshots/recordings if applicable.
      placeholder: "Commit SHA, hardware backend, or extra reproduction notes."

  - type: markdown
    attributes:
      value: |
        ---
        **Please Note:**
        - Always execute tests inside the hermetic ClauseOS workbench (`clause test` or `.\cx.ps1 test` / `./cx.sh test`) rather than an uninitialized host shell.
        - Search open and closed issues before submitting a duplicate report.
        - Review our [Code of Conduct](../CODE_OF_CONDUCT.md) and [Contributing Guidelines](../CONTRIBUTING.md).